<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>GraphiQL</title>
  <style>
    body {
      height: 100%;
      margin: 0;
      width: 100%;
      overflow: hidden;
    }
    #graphiql {
      height: 100vh;
    }
    .graphiql-container {
      font-family: system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
    }
  </style>
  <script crossorigin src="https://unpkg.com/react@17/umd/react.development.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@17/umd/react-dom.development.js"></script>
  <link rel="stylesheet" href="https://unpkg.com/graphiql@1.8.0/graphiql.min.css" />
  <script src="https://unpkg.com/graphiql@1.8.0/graphiql.min.js"></script>
</head>
<body>
  <div id="graphiql"></div>
  <script>
    // Функция для выполнения GraphQL запросов
    function graphQLFetcher(graphQLParams) {
      return fetch('/graphql', {
        method: 'post',
        headers: {
          'Accept': 'application/json',
          'Content-Type': 'application/json',
        },
        body: JSON.stringify(graphQLParams),
        credentials: 'same-origin',
      }).then(function (response) {
        return response.json().catch(function () {
          return response.text();
        });
      });
    }

    // Запуск GraphiQL
    ReactDOM.render(
      React.createElement(GraphiQL, {
        fetcher: graphQLFetcher,
        defaultQuery: `# Добро пожаловать в GraphiQL
#
# Примеры запросов:
# 
# Получить все страны
query {
  countries {
    id
    name
    code
  }
}
`
      }),
      document.getElementById('graphiql')
    );
  </script>
</body>
</html>
